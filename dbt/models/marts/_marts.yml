version: 2

models:
  - name: fct_orders
    description: One row per order with totals calculated from its items.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['new', 'paid', 'shipped', 'delivered', 'cancelled', 'returned']
      - name: total_amount
        description: Sum of quantity x unit price of the order's items (price at the time of purchase).

  - name: fct_order_items
    description: One row per order item with product attributes.
    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          # Streaming keeps writing while dbt runs, so a brand-new item may briefly
          # reference an order that was not yet in silver when fct_orders was built.
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
              config:
                severity: warn
      - name: unit_price
        data_tests:
          - not_null

  - name: dim_customers
    description: Customers with order statistics (lifetime value excludes cancelled and returned orders).
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: dim_products_scd2
    description: >
      SCD Type 2 price history built from the full CDC event history in bronze.
      One row per price version; valid_to is null for the current price.
    columns:
      - name: product_id
        data_tests:
          - not_null
      - name: price
        data_tests:
          - not_null
      - name: valid_from
        data_tests:
          - not_null

  - name: mart_daily_revenue
    description: Daily revenue and units per product category (cancelled and returned orders excluded).
